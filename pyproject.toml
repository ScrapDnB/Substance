[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "substance-editor"
version = "0.1.0a5"
description = "Desktop ASS subtitle editor for timing and translation"
requires-python = ">=3.11"
dependencies = ["dubbing-online-client==0.1.0", "keyring>=25,<26", "certifi>=2025.1.31", "PySide6==6.10.2", "numpy>=2.2,<3", "imageio-ffmpeg>=0.6,<1", "pyspellchecker>=0.8,<1", "pyobjc-core==12.1; sys_platform == 'darwin'", "pyobjc-framework-Cocoa==12.1; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.15,<7"]

[project.scripts]
substance = "substance.app:main"

[tool.setuptools.package-data]
substance = ["qml/*.qml", "qml/+macOS/*.qml", "resources/*", "resources/icons/*.svg", "resources/fonts/*", "resources/licenses/**/*"]

[tool.setuptools.packages.find]
include = ["substance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
