name: Test and build alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install ./vendor/dubbing-online-client
          python -m pip install -e ".[dev]"
      - name: Install portable media libraries on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/micromamba
          if [[ "$(uname -m)" == "arm64" ]]; then
            media_platform=osx-arm64
          else
            media_platform=osx-64
          fi
          curl -L --fail "https://micro.mamba.pm/api/micromamba/$media_platform/latest" -o build/micromamba/package.tar.bz2
          tar -xjf build/micromamba/package.tar.bz2 -C build/micromamba bin/micromamba
          export MAMBA_ROOT_PREFIX="$PWD/build/mamba-root"
          export CONDA_OVERRIDE_OSX=15.0
          build/micromamba/bin/micromamba --no-rc create --yes --prefix "$PWD/build/portable" --channel conda-forge libass=0.17.5 ffmpeg=9.0.2
          echo "SUBSTANCE_LIBASS=$PWD/build/portable/lib/libass.9.dylib" >> "$GITHUB_ENV"
          echo "SUBSTANCE_FFPROBE=$PWD/build/portable/bin/ffprobe" >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-ffmpeg
      - name: Configure Windows libass
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mediaBin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          if (!(Test-Path "$mediaBin\libass-9.dll") -or !(Test-Path "$mediaBin\ffprobe.exe")) {
            throw "Missing media libraries in $mediaBin"
          }
          "SUBSTANCE_LIBASS=$mediaBin\libass-9.dll" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUBSTANCE_FFPROBE=$mediaBin\ffprobe.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/test.py
      - name: Compile package
        run: python scripts/build.py
      - name: Check packaged application
        run: python scripts/verify_package.py
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Substance.app dist/Substance-macOS.zip
      - name: Archive Windows application
        if: runner.os == 'Windows'
        run: python -c "import shutil; shutil.make_archive('dist/Substance-Windows-x64', 'zip', root_dir='dist', base_dir='Substance')"
      - uses: actions/upload-artifact@v4
        with:
          name: Substance-0.1.0-alpha.5-${{ runner.os }}
          path: |
            dist/Substance-*.zip
          retention-days: 14
          if-no-files-found: error
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-${{ runner.os }}
          path: |
            build/qa/ci-package*
            build/qa/macos-minimum.json
          if-no-files-found: ignore
          retention-days: 14
